[project]
name = "ledger-api"
version = "0.3.0"
description = "SOC Claim Ledger service: submission ingestion to Parquet and the claim ledger recomputed in SQL with DuckDB."
requires-python = ">=3.11"
dependencies = [
  "duckdb==2.0.0",
  "fastapi==0.162.0",
  "prometheus-client==0.26.0",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "httpx==0.28.1", "ruff==0.17.1", "mypy==2.4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ledger_api"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["ledger_api"]
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "--cov=ledger_api --cov-report=term-missing:skip-covered --cov-report=json:coverage/coverage.json --cov-report=xml:coverage/coverage.xml"

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
