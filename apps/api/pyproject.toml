[project]
name = "ledger-api"
version = "0.2.0"
description = "SOC Claim Ledger service: submission ingestion to Parquet and the claim ledger recomputed in SQL with DuckDB."
requires-python = ">=3.11"
dependencies = [
  "duckdb==1.3.2",
  "fastapi==0.162.0",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "httpx==0.28.1", "ruff==0.12.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ledger_api"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "--cov=ledger_api --cov-report=term-missing:skip-covered"

[tool.coverage.run]
branch = true
omit = ["ledger_api/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
