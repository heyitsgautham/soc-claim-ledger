name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pnpm api:setup
          pnpm exec playwright install --with-deps chromium
      - name: Lint
        run: pnpm lint
      - name: Simulate and analyse
        run: pnpm simulate && pnpm analyse
      - name: Unit tests with coverage
        run: pnpm test:coverage
      - name: API tests with coverage, SQL ledger parity
        run: pnpm test:api
      - name: Production build
        run: pnpm --filter @ledger/web build
      - name: Typecheck
        run: pnpm typecheck
      - name: Offline end-to-end test
        run: |
          pnpm start > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3157/title > /dev/null && break; sleep 1; done
          pnpm test:e2e
      - name: Architecture PDF, two pages at most
        run: pnpm docs:pdf
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - name: Audit npm and Python dependencies, high severity and up
        run: pnpm audit:deps

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the full history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  offline-image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and run the demo with networking removed
        run: make offline-test
