name: codeql

# Static analysis of the TypeScript and the Python for injection, path traversal and
# unsafe deserialisation. Findings land in the repository's code scanning alerts.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4
      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
